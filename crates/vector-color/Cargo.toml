[package]
name = "vector-color"
version = "0.0.1"
edition = "2021"
description = "Real ICC-based colour management (qcms) for VRAVIO's vector environment — Stage 14 of docs/vector-plan.md."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
qcms = "0.3"
# Fills the gap qcms leaves open (see the module doc comment below):
# BSD-3-Clause OR Apache-2.0, pure Rust, no C/FFI dependencies (only
# num-traits + pxfm, both pure Rust), reads a profile's real B2A tag —
# genuine forward sRGB → CMYK via ICC, not a re-derivation of qcms's own
# CMYK → RGB (kept, unchanged, on qcms — no reason to replace working code).
moxcms = { version = "0.9", default-features = false, features = ["lut"] }

[profile.release]
opt-level = "s"
lto = true
