[package]
name = "vector-geometry"
version = "0.0.1"
edition = "2021"
description = "Boolean polygon operations for VRAVIO's vector environment (Stage 7 of docs/vector-plan.md) — the WASM side of VectorGeometryPort, cross-checked against the TS reference implementation in @vravio/kernel."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
geo-types = "0.6"
geo-booleanop = "0.3"

[profile.release]
opt-level = "s"
lto = true
