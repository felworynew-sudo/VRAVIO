[package]
name = "vravio"
version = "0.0.1"
description = "VRAVIO"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vravio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
# WebView2 already powers the Tauri window. Its Print API accepts a named
# printer, so Windows can submit VRAVIO's prepared page without a second UI.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Printing"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
