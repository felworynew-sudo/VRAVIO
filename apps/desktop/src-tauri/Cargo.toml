[package]
name = "vravio"
version = "0.0.1"
description = "VRAVIO"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vravio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
